services:
  backend:
    build: ./backend
    init: true        # reap Chromium child processes
    shm_size: "1gb"   # Chromium crashes with the 64 MB default /dev/shm
    env_file:
      - path: credential/.env
        required: false
    volumes:
      - smartkol-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  smartkol-data:
